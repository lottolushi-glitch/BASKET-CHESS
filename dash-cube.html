<style>

.cd{flex:0 0 auto;width:160px;position:relative;border-radius:14px;overflow:hidden;border:2px solid #a8283f;scroll-snap-align:center;cursor:pointer;background:#2a0a12;box-shadow:0 4px 14px rgba(0,0,0,.45)}

.cd.lk canvas{filter:brightness(.28) saturate(.6)}.cd.lk{cursor:default;border-color:#5a1a28}

#pad{visibility:hidden}.pl #pad{visibility:visible}

#ld canvas{width:min(92vw,520px);height:auto;aspect-ratio:360/200;border-radius:14px}
#lb{width:min(80vw,420px);height:12px;border:2px solid #a8283f;border-radius:8px;margin-top:18px;overflow:hidden}
#lf{display:block;height:100%;width:0;background:#a8283f}
#lh{margin:0 0 12px;font-size:clamp(26px,7vw,44px);letter-spacing:6px;color:#f3dcd6;text-shadow:0 0 18px #a8283f}
#ld p{margin:10px 0 0;font-size:14px;letter-spacing:1px}
#rt{position:fixed;inset:0;z-index:100;display:none;background:#14040a;color:#f3dcd6;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;gap:18px}
#ph{width:46px;height:78px;border:4px solid #c0344f;border-radius:10px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rt{display:flex}}
@media (max-height:500px){#ld canvas{width:auto;height:50vh}#lh{font-size:24px;margin-bottom:6px}}
#pad{display:flex;gap:10px;padding:12px;width:100%;max-width:900px}
.b{flex:1;height:78px;border-radius:18px;font-size:30px;touch-action:none}
.b:active{filter:brightness(1.35)}
#J{flex:1.6;margin-left:auto}
@media (orientation:landscape) and (max-height:620px){
#wrap{max-width:none;width:auto;height:100%;display:flex;justify-content:center}
canvas{height:100%;width:auto;max-width:100%}
#pad{display:contents}
.b{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:88px;height:88px;flex:none;opacity:.5;z-index:5}
.b[data-k=L]{left:calc(14px + env(safe-area-inset-left,0px))}
.b[data-k=R]{left:calc(112px + env(safe-area-inset-left,0px))}
#J{right:calc(14px + env(safe-area-inset-right,0px));width:104px;margin:0}
#ov h1{font-size:22px}#ov p{margin:2px 0 8px;font-size:12px}#go{padding:6px 24px;font-size:16px}#sel{margin-top:6px}
}
</style></head><body>
<div id="rt"><div id="ph"></div><p>Tourne ton téléphone<br>Ce jeu se joue en mode paysage</p></div><div id="ld"><h1 id="lh">DASH CUBE</h1><canvas id="lc" width="360" height="200"></canvas><div id="lb"><i id="lf"></i></div><p id="lt">Chargement… 0%</p></div><div id="wrap"><canvas id="c" width="720" height="400"></canvas>
<button id="mn">☰</button><div id="ov"><h1>DASH CUBE</h1><p id="sub">Fais défiler les missions vers la gauche<br>◀ ▶ pour rouler, ⬆ pour sauter<br>(clavier : flèches / ZQSD, espace)</p><div id="sel"></div><button id="go">Jouer</button></div></div>
<div id="pad"><button class="b" data-k="L">◀</button><button class="b" data-k="R">▶</button><button class="b" id="J" data-k="J">⬆</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=720,H=400,GY=500,PS=26;
let B1='#7b1426',B2='#a8283f',B3='#42091a',ACC='#e0506b',AC2='#c0344f';const css=getComputedStyle(document.documentElement);
const col=n=>css.getPropertyValue(n).trim();
const stat=[{x:-400,y:GY,w:3100,h:400}];
for(let i=0;i<15;i++)stat.push({x:2700+44*i,y:GY-16*(i+1),w:44,h:16*(i+1)});
stat.push({x:3360,y:260,w:740,h:240},{x:4960,y:260,w:560,h:300});
const ledgeR={x:4100,y:260,w:200,h:240},brR={x:4820,y:260,w:130,h:16},portal={x:5290,y:190,w:46,h:70};
let p,robots,parts,rock,ledge,br,state='menu',deadT=0,deaths=0,camX=0,camY=0,shake=0,tick=0,jb=0,tr=[],ex=[],fkHit=[],LV=0,resume=false,prog=0,swOn=0,pp=0,qt=0,inv=0,winT=0,wq=null;
const inp={L:0,R:0,J:0,kL:0,kR:0,kJ:0};
function reset(){
 p={x:80,y:GY-PS,vx:0,vy:0,ang:0,on:false,coy:0,st:null};
 robots=[];for(let i=0;i<8;i++)robots.push({cx:520+i*270,amp:55,sp:.03+(i%3)*.01,ph:i*1.7,x:0});
 parts=[];rock={x:0,ang:0,active:false,passed:false};
 ledge={on:false,t:0,fallen:false,fy:0,fv:0};br={t:0,started:false};brR.x=4820;
 theme();fkHit=[];tr=[];ex=[];swOn=0;qt=0;pp=LV?LVS[LV].p:0;
 if(LV){const d=LVS[LV];ex=d.sol.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3],g:a[4],c:a[5],ic:a[6],hid:a[7],bn:a[8]}));tr=d.tr.map(t=>({...t,on:0,vy:0,done:0}));robots=(d.rb||[]).map((c,i)=>({cx:c,amp:55,sp:.03+(i%3)*.012,ph:i*1.7,x:0}))}
 camX=0;camY=p.y-260;
}
const ov=document.getElementById('ov');
function show(h,s,b){ov.querySelector('h1').textContent=h;document.getElementById('sub').innerHTML=s;document.getElementById('go').textContent=b;ov.style.display='flex';buildSel()}
document.getElementById('go').onclick=()=>{snd('c');ov.style.display='none';if(resume){resume=false;state='play';return}if(state==='win')LV=(LV+1)%42;reset();state='play'};

function solids(){if(LV)return ex.filter(s=>!s.gone&&!s.g).concat(tr.filter(t=>t.done&&t.k!=='s'&&t.k!=='v'&&t.k!=='y'));const a=stat.slice();if(!ledge.fallen)a.push(ledgeR);a.push(brR);return a}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function boom(x,y,w,h,n){snd('v');for(let i=0;i<n;i++)parts.push({x:x+Math.random()*w,y:y+Math.random()*h,vx:(Math.random()-.5)*6,vy:-Math.random()*6,s:3+Math.random()*6,r:Math.random()*6,c:Math.random()<.5?B1:(Math.random()<.5?B2:B3)})}
function kill(){
 if(state!=='play')return;state='dead';snd('b');deadT=0;deaths++;
 for(let i=0;i<30;i++)parts.push({x:p.x+13,y:p.y+13,vx:(Math.random()-.5)*10,vy:-Math.random()*9-1,s:3+Math.random()*6,r:Math.random()*6,c:Math.random()<.5?'#0b0b0b':(Math.random()<.5?B2:B1)});
 shake=14;
}
function rockPos(){const x=rock.x,R=60;let h=x>=3360?240:x<=2700?0:240*(x-2700)/660;return{x:x,y:GY-h-R-((x>2700&&x<3360)?4:0),r:R}}
function sheltered(){return p.on&&p.x>=2562&&p.x+PS<=2698&&p.y>GY-30}
function theme(){const n=LV>=33;B1=n?'#1a2a63':'#7b1426';B2=n?'#5b7cf0':'#a8283f';B3=n?'#0a1233':'#42091a';ACC=n?'#9db8ff':'#e0506b';AC2=n?'#8fb0ff':'#c0344f'}
function cInv(){if(!LV)return 0;const d=LVS[LV];qt++;let v=0;(d.iv||[]).forEach(z=>{if(p.x+13>=z[0]&&p.x+13<=z[1])v^=1});if(d.pt)v^=Math.floor(qt/d.pt[0])&1;return v}
function update(){
 tick++;
 let L=inp.L||inp.kL,R=inp.R||inp.kR;const J=inp.J||inp.kJ;inv=cInv();if(inv){const q=L;L=R;R=q}
 if(jb>0)jb--;
 shake*=.9;
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.vy+=.5;q.x+=q.vx;q.y+=q.vy;q.r+=.2;if(q.y>1100)parts.splice(i,1)}
 if(state==='dead'){deadT++;if(deadT>85){reset();state='play'}return}
 if(state==='win'){winT++;if(winT===95&&wq)show(wq[0],wq[1],wq[2]);return}
 if(state!=='play')return;
 // bridge & ledge
 if(br.started){br.t++}
 const nx=4300+520*(1-Math.cos((br.t-150)/300*Math.PI*2))/2,dx=br.started?nx-brR.x:0;if(br.started)brR.x=nx;
 if(p.st===brR)p.x+=dx;
 if(!ledge.fallen&&!ledge.on&&p.on&&p.x+PS>=4120&&p.x<4300){ledge.on=true;br.started=true;br.t=0}
 if(ledge.on&&!ledge.fallen){ledge.t++;if(ledge.t>230){ledge.fallen=true;boom(4100,260,200,40,40)}}
 if(ledge.fallen){ledge.fv+=.5;ledge.fy+=ledge.fv}
 // movement
 p.vx+=((LV&&LVS[LV].ar?(L?1.5:R?6.5:4):(R-L)*4.4)-p.vx)*(p.st&&p.st.ic?.04:.25);
 p.coy=p.on?7:p.coy-1;
 if(J&&jb>0&&p.coy>0){p.vy=-11.8*(LV&&(LVS[LV].jz||[]).some(z=>p.x+13>=z[0]&&p.x+13<=z[1])?3.16:1);p.coy=0;jb=0;snd('j')}
 if(!J&&p.vy<-4)p.vy*=.88;
 p.vy=Math.min(p.vy+(LV&&LVS[LV].gr||.62),14);
 if(LV)(LVS[LV].wd||[]).forEach(z=>{if(p.x>=z[0]&&p.x<=z[1])p.x+=z[2]});
 if(p.st&&p.st.c)p.x+=p.st.c;
 p.x+=p.vx;
 for(const s of solids()){if(hit({x:p.x,y:p.y,w:PS,h:PS},s)){
  if(p.y+PS-s.y<=18&&p.vy>=0&&s!==brR){p.y=s.y-PS}
  else{if(p.vx>0)p.x=s.x-PS;else if(p.vx<0)p.x=s.x+s.w;p.vx=0}}}
 p.y+=p.vy;p.on=false;p.st=null;
 for(const s of solids()){if(hit({x:p.x,y:p.y,w:PS,h:PS},s)){
  if(p.vy>0){p.y=s.y-PS;p.vy=0;p.on=true;p.st=s;if(s.bn){p.vy=-20;p.on=false;snd('j')}}else if(p.vy<0){p.y=s.y+s.h;p.vy=0}}}
 if(p.on)p.ang+=p.vx*.06;else p.ang+=p.vx*.06;
 if(p.on&&Math.abs(p.vx)<.3){const t=Math.round(p.ang/(Math.PI/2))*Math.PI/2;p.ang+=(t-p.ang)*.25}
 // robots
 for(const r of robots){r.x=r.cx+Math.sin(tick*r.sp+r.ph)*r.amp;
  if(hit({x:p.x+3,y:p.y+3,w:PS-6,h:PS-6},{x:r.x+3,y:GY-PS+3,w:PS-6,h:PS-6}))kill()}
 // rock
 if(!rock.passed&&!rock.active&&p.x>3560&&p.y<300){rock.active=true;rock.x=4450;snd('d')}
 if(rock.active){rock.x-=6;rock.ang-=.1;
  if(rock.x<2150){rock.active=false;rock.passed=true}
  else if(!sheltered()){const c=rockPos(),qx=Math.max(p.x,Math.min(c.x,p.x+PS)),qy=Math.max(p.y,Math.min(c.y,p.y+PS));
   if(Math.hypot(c.x-qx,c.y-qy)<c.r-6)kill()}}
 if(p.y>760)kill();
 if(LV){const d=LVS[LV],pl={x:p.x,y:p.y,w:PS,h:PS};
 (d.fk||[]).forEach((x,i)=>{if(hit(pl,{x,y:430,w:46,h:70}))fkHit[i]=1});
 for(const t of tr){
  if(!t.on&&(t.tx==='S'?swOn:typeof t.tx==='string'?fkHit[t.tx[1]]:(t.lt?p.x<=t.tx:p.x>=t.tx))){t.on=1;if((t.k==='s'||t.k==='m')&&t.tx>-1e8)snd('s');if(t.k==='v'){const s=ex[t.i];s.gone=1;boom(s.x,s.y,s.w,40,26)}}
  if(!t.on)continue;let mv=0;
  if(t.k==='d'&&!t.done){t.vy+=t.g||1.2;t.y+=t.vy;mv=1;if(t.y>=t.ty){t.y=t.ty;t.done=1;snd('d')}}
  if(t.k==='m'&&!t.done){t.x+=t.vx;mv=1;if(t.vx<0?t.x<=t.ex:t.x>=t.ex){t.x=t.ex;t.done=1}}
  if(t.k==='o'){t.a=(t.a||0)+1;t.x=t.x0+t.amp*Math.sin(t.a*t.sp);mv=1}
  if(t.k==='y'&&!t.done){t.x+=t.vx;t.y+=t.vy;mv=1;if(t.y>700)t.done=1}
  if(t.k==='p'){t.a=(t.a||0)+1;t.y=t.y0+t.amp*(1-Math.cos(t.a*t.sp))/2;mv=1}
  if((t.k==='s'||mv)&&hit({x:p.x+3,y:p.y+3,w:PS-6,h:PS-6},t))kill()}}
 if(LV){const d=LVS[LV],pl={x:p.x,y:p.y,w:PS,h:PS},hp=x=>hit(pl,{x,y:430,w:46,h:70});
 (d.tp||[]).forEach(a=>{if(hp(a[0])){p.x=a[1];p.y=GY-PS;p.vx=0;p.vy=0;snd('s')}});
 (d.kp||[]).forEach(x=>{if(hp(x)){boom(x,430,46,70,20);kill()}});
 (d.sw||[]).forEach(x=>{if(!swOn&&hit(pl,{x,y:488,w:50,h:12})){swOn=1;snd('w')}});
 if(d.fl&&Math.abs(p.x-pp)<d.fl[0]&&pp<d.fl[1])pp+=3.2}
 const P=LV?{x:pp,y:430,w:46,h:70}:portal;
 if(state==='play'&&(!LV||!LVS[LV].sw||LVS[LV].nl||swOn)&&hit({x:p.x,y:p.y,w:PS,h:PS},P)){state='win';snd('w');prog=Math.max(prog,LV+1);try{localStorage.setItem('cn_prog',prog)}catch(e){}winT=0;wq=['MISSION '+(LV+1)+' TERMINÉE !',(LV<41?'Bien joué… la suite sera pire.':'Tu as tout terminé !')+'<br>Échecs : '+deaths,LV<41?'Mission suivante':'Rejouer']}
 camX+=(Math.max(LV?LVS[LV].cx||-40:-40,Math.min(LV?LVS[LV].w-W:4840,p.x-240))-camX)*.12;
 camY+=(p.y-260-camY)*.1;
}
function box(s){ctx.fillStyle=B1;ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='rgba(0,0,0,.18)';
 const x1=Math.min(s.x+s.w,camX+W);for(let x=Math.ceil(Math.max(s.x,camX)/48)*48;x<x1;x+=48)ctx.fillRect(x,s.y+7,2,Math.min(s.h-7,40));
 ctx.fillStyle=B2;ctx.fillRect(s.x,s.y,s.w,5);ctx.strokeStyle=B3;ctx.lineWidth=2;ctx.strokeRect(s.x,s.y,s.w,s.h)}
function cube(x,y,s,a,fill,line){ctx.save();ctx.translate(x+s/2,y+s/2);ctx.rotate(a);ctx.fillStyle=fill;ctx.fillRect(-s/2,-s/2,s,s);ctx.strokeStyle=line;ctx.lineWidth=2;ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore()}
function drawPlayer(){if(state==='dead')return;cube(p.x,p.y,PS,p.ang,'#0a0a0a',AC2);
 ctx.save();ctx.translate(p.x+13,p.y+13);ctx.rotate(p.ang);ctx.fillStyle='rgba(192,52,79,.35)';ctx.fillRect(-9,-9,7,7);ctx.restore()}
function drawWin(){const t=winT,cx=W/2,cy=H/2;ctx.save();ctx.fillStyle='rgba(6,2,10,'+Math.min(.78,t/20)+')';ctx.fillRect(0,0,W,H);
 const s=Math.min(1,t/22),S=250*s*(2-s),op=Math.max(0,Math.min(1,(t-30)/30)),o=op*op*(3-2*op)*S/2;
 if(t>28){const g=ctx.createRadialGradient(cx,cy,5,cx,cy,S*.7);g.addColorStop(0,'#ffffff');g.addColorStop(.4,ACC);g.addColorStop(1,B3);ctx.fillStyle=g;ctx.fillRect(cx-S/2,cy-S/2,S,S);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.globalAlpha=op;ctx.font='bold 26px system-ui';ctx.fillText('MISSION '+(LV+1),cx,cy-4);ctx.font='bold 18px system-ui';ctx.fillText('RÉUSSIE !',cx,cy+24);ctx.globalAlpha=1;
  for(let i=0;i<28;i++){const a=i*2.4,r=(t-30)*(2+i%5)*2.2,z=4+i%4*2;ctx.fillStyle=i%3?B2:'#fff';ctx.fillRect(cx+Math.cos(a)*r-z/2,cy+Math.sin(a)*r-z/2,z,z)}}
 ctx.fillStyle=B1;ctx.strokeStyle=ACC;ctx.lineWidth=3;
 ctx.fillRect(cx-S/2-o,cy-S/2,S/2,S);ctx.strokeRect(cx-S/2-o,cy-S/2,S/2,S);ctx.fillRect(cx+o,cy-S/2,S/2,S);ctx.strokeRect(cx+o,cy-S/2,S/2,S);ctx.restore()}
function drawP(x,y){ctx.fillStyle=B1;ctx.beginPath();ctx.roundRect(x-8,y-8,62,78,[30,30,0,0]);ctx.fill();ctx.fillStyle='#14040a';ctx.beginPath();ctx.roundRect(x,y,46,70,[23,23,0,0]);ctx.fill();ctx.strokeStyle=ACC;ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.lineDashOffset=-tick*.5;ctx.beginPath();ctx.arc(x+23,y+36,14,0,6.3);ctx.stroke();ctx.setLineDash([])}
function drawTr(){if(!LV)return;const d=LVS[LV];(d.msg||[]).forEach(m=>{ctx.fillStyle=ACC;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(m[1],m[0],m[2]||GY-90)});
